<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUKMEE - Premium Mobile Repair & Device Care</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #000000;
            --bg-secondary: #0A0A0A;
            --bg-elevated: #111111;
            --bg-card: #151515;
            --bg-surface: #1C1C1E;
            --text-primary: #F5F5F7;
            --text-secondary: #A1A1A6;
            --text-muted: #6E6E73;
            --border: rgba(255,255,255,0.10);
            --border-soft: rgba(255,255,255,0.06);
            --accent: #B7FF3C;
            --accent-soft: #A8E63D;
            --success: #30D158;
            --warning: #FFD60A;
            --error: #FF453A;
            --info: #64D2FF;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }
        input, select { font-family: inherit; background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-primary); padding: 12px 16px; border-radius: 8px; }
        input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(183, 255, 60, 0.1); }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 80px;
            height: 72px;
            background: transparent;
            transition: all 0.3s ease;
        }

        .nav.scrolled {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-soft);
        }

        .nav-logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.8px;
            background: linear-gradient(135deg, var(--accent), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-center { display: flex; gap: 48px; font-size: 15px; }
        .nav-center a { color: var(--text-secondary); transition: color 0.2s; }
        .nav-center a:hover { color: var(--accent); }
        .nav-right { display: flex; gap: 24px; align-items: center; }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #a0e608);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(183, 255, 60, 0.2);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            background: rgba(183, 255, 60, 0.05);
        }

        .btn-text { background: none; color: var(--accent); padding: 12px 0; }
        .btn-text:hover { color: var(--accent-soft); }

        /* Hero */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 120px 40px 80px;
            margin-top: 72px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(183, 255, 60, 0.03) 0%, rgba(0, 0, 0, 0) 100%);
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(183, 255, 60, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
        }

        .hero > * { position: relative; z-index: 1; }

        .hero h1 {
            font-size: 88px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 32px;
            letter-spacing: -1.5px;
            max-width: 1000px;
        }

        .hero h1 span {
            background: linear-gradient(135deg, var(--accent), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            font-size: 20px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            max-width: 600px;
            line-height: 1.6;
        }

        .hero-support {
            font-size: 17px;
            color: var(--text-muted);
            margin-bottom: 56px;
            max-width: 700px;
            line-height: 1.6;
        }

        .hero-ctas { display: flex; gap: 16px; justify-content: center; margin-bottom: 56px; flex-wrap: wrap; }
        .hero-features { display: flex; gap: 48px; justify-content: center; font-size: 15px; color: var(--text-secondary); }

        /* Section */
        .section {
            padding: 160px 80px;
            max-width: 1440px;
            margin: 0 auto;
            position: relative;
        }

        .section h2 {
            font-size: 56px;
            font-weight: 700;
            margin-bottom: 80px;
            line-height: 1.2;
            letter-spacing: -1px;
        }

        .section h3 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 40px;
        }

        /* Image Container */
        .image-container {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            aspect-ratio: 16/9;
            margin-bottom: 40px;
            border: 1px solid var(--border);
        }

        .image-bg {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-surface) 100%);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px 24px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(183, 255, 60, 0.1) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(183, 255, 60, 0.15);
        }

        .card:hover::before { opacity: 1; }

        .card.selected {
            border-color: var(--accent);
            background: linear-gradient(135deg, rgba(183, 255, 60, 0.1), rgba(183, 255, 60, 0.05));
        }

        .card > * { position: relative; z-index: 1; }

        .card-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .card-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .card-price {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
            margin-top: 12px;
        }

        /* Feature Grid */
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin-bottom: 100px;
        }

        .feature-item {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-surface) 100%);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .feature-icon {
            font-size: 48px;
            margin-bottom: 20px;
            display: block;
        }

        .feature-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .feature-desc {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Timeline */
        .timeline {
            position: relative;
            padding: 40px 0;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 22px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--accent) 0%, transparent 100%);
        }

        .timeline-item {
            display: flex;
            margin-bottom: 40px;
            align-items: flex-start;
        }

        .timeline-node {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-muted);
            margin-right: 32px;
            margin-top: 6px;
            flex-shrink: 0;
            position: relative;
            z-index: 2;
            border: 2px solid var(--bg-primary);
        }

        .timeline-item.completed .timeline-node {
            background: var(--accent);
            box-shadow: 0 0 0 4px rgba(183, 255, 60, 0.1);
        }

        .timeline-item.active .timeline-node {
            background: var(--accent);
            width: 16px;
            height: 16px;
            margin-right: 30px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(183, 255, 60, 0.7); }
            50% { box-shadow: 0 0 0 8px rgba(183, 255, 60, 0); }
        }

        .timeline-content {
            flex: 1;
        }

        .timeline-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .timeline-desc {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Testimonial */
        .testimonial-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }

        .testimonial-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-surface) 100%);
            padding: 32px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .testimonial-stars {
            font-size: 14px;
            margin-bottom: 16px;
            color: var(--accent);
        }

        .testimonial-text {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: var(--text-secondary);
        }

        .testimonial-author {
            font-size: 14px;
            font-weight: 600;
        }

        .testimonial-role {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Professional Card */
        .professional-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 32px;
        }

        .professional-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-surface) 100%);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }

        .professional-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
        }

        .professional-avatar {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, rgba(183, 255, 60, 0.2), rgba(100, 210, 255, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }

        .professional-info {
            padding: 24px;
        }

        .professional-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .professional-rating {
            font-size: 13px;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .professional-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            margin: 80px 0;
            padding: 60px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 52px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .stat-label {
            font-size: 15px;
            color: var(--text-secondary);
        }

        /* Form */
        .form-group { margin-bottom: 24px; }
        .form-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text-secondary); }
        .form-input { width: 100%; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; }

        /* Summary Card */
        .summary-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-surface) 100%);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            margin-bottom: 32px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-soft);
        }

        .summary-row:last-child { border-bottom: none; }
        .summary-label { color: var(--text-secondary); font-size: 14px; }
        .summary-value { font-weight: 600; font-size: 15px; }

        /* Progress */
        .progress-indicator {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 60px;
        }

        .progress-step {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--bg-surface);
            transition: all 0.3s;
        }

        .progress-step.active {
            background: var(--accent);
            width: 24px;
            border-radius: 4px;
        }

        .progress-step.completed {
            background: var(--success);
        }

        /* Footer */
        .footer {
            background: linear-gradient(135deg, var(--bg-surface) 0%, var(--bg-elevated) 100%);
            padding: 80px;
            border-top: 1px solid var(--border-soft);
        }

        .footer-content {
            max-width: 1440px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 40px;
            margin-bottom: 40px;
        }

        .footer-column h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .footer-column a {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            transition: color 0.2s;
        }

        .footer-column a:hover {
            color: var(--accent);
        }

        .footer-bottom {
            border-top: 1px solid var(--border-soft);
            padding-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Order Status */
        .order-status {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-surface) 100%);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            margin-bottom: 40px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-soft);
        }

        .order-id {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent);
        }

        .status-badge {
            background: rgba(48, 209, 88, 0.1);
            color: var(--success);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .nav { padding: 0 40px; }
            .section { padding: 100px 40px; }
            .section h2 { font-size: 40px; margin-bottom: 60px; }
            .hero h1 { font-size: 60px; }
            .nav-center { display: none; }
            .footer-content { grid-template-columns: repeat(2, 1fr); }
            .feature-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 640px) {
            .nav { padding: 0 20px; height: 64px; }
            .section { padding: 60px 20px; }
            .section h2 { font-size: 28px; }
            .hero { padding: 100px 20px 60px; margin-top: 64px; }
            .hero h1 { font-size: 40px; }
            .hero::before { width: 300px; height: 300px; }
            .hero-ctas { flex-direction: column; }
            .hero-features { flex-direction: column; gap: 24px; }
            .nav-right { gap: 12px; }
            .btn { padding: 11px 16px; font-size: 14px; }
            .footer-content { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in-up {
            animation: fadeInUp 0.6s ease-out;
        }

        /* SVG Phone Device */
        .phone-device {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .device-illustration {
            position: relative;
            width: 240px;
            height: 480px;
        }
    
        /* ===== HUKMEE V2 visual + alignment fixes ===== */
        html { scroll-padding-top: 92px; }
        body { overflow-x: hidden; }
        .section { width: min(1180px, calc(100% - 48px)); margin: 0 auto; padding-left: 0; padding-right: 0; }
        .nav { width: 100%; box-sizing: border-box; }
        .nav-logo { cursor: pointer; letter-spacing: -1.5px; }
        .hero-v2 { min-height: 92vh; display:grid; grid-template-columns: 1.02fr .98fr; align-items:center; gap:64px; width:min(1280px, calc(100% - 64px)); margin:0 auto; padding:140px 0 80px; }
        .hero-copy { position:relative; z-index:2; }
        .eyebrow { display:inline-flex; align-items:center; gap:9px; padding:8px 12px; border:1px solid rgba(183,255,60,.24); border-radius:999px; color:var(--accent); background:rgba(183,255,60,.06); font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; margin-bottom:24px; }
        .eyebrow:before { content:''; width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 18px rgba(183,255,60,.8); }
        .hero-v2 h1 { font-size:clamp(54px,7vw,94px); line-height:.94; letter-spacing:-.065em; max-width:760px; margin-bottom:28px; }
        .hero-v2 h1 span { color:var(--accent); }
        .hero-v2 .hero-support { margin:0 0 34px; max-width:650px; }
        .hero-visual { min-height:620px; position:relative; border-radius:34px; overflow:hidden; border:1px solid rgba(255,255,255,.10); background:#101010; box-shadow:0 35px 100px rgba(0,0,0,.5); }
        .hero-visual img { width:100%; height:100%; min-height:620px; object-fit:cover; opacity:.88; filter:saturate(.7) contrast(1.08); }
        .hero-visual:after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.82) 100%),linear-gradient(90deg,rgba(183,255,60,.08),transparent 42%); }
        .visual-chip { position:absolute; z-index:2; left:26px; right:26px; bottom:26px; display:flex; justify-content:space-between; align-items:end; gap:20px; padding:22px; border-radius:20px; background:rgba(9,9,9,.72); border:1px solid rgba(255,255,255,.12); backdrop-filter:blur(18px); }
        .visual-chip strong { display:block; font-size:20px; margin-bottom:5px; }
        .visual-chip span { color:var(--text-secondary); font-size:13px; }
        .trust-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:20px; overflow:hidden; margin-top:-20px; position:relative; z-index:3; }
        .trust-item { background:#0b0b0b; padding:24px; min-height:112px; }
        .trust-item b { display:block; font-size:15px; margin:10px 0 4px; }
        .trust-item span { color:var(--text-secondary); font-size:13px; line-height:1.5; }
        .trust-icon { color:var(--accent); font-size:20px; }
        .section-kicker { color:var(--accent); text-transform:uppercase; letter-spacing:.16em; font-size:12px; font-weight:700; margin-bottom:16px; }
        .section-head { display:flex; justify-content:space-between; gap:40px; align-items:end; margin-bottom:48px; }
        .section-head h2 { margin:0; max-width:720px; }
        .section-head p { max-width:430px; color:var(--text-secondary); line-height:1.7; margin:0; }
        .service-grid-v2 { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
        .service-card-v2 { min-height:260px; padding:26px; border-radius:24px; border:1px solid var(--border); background:linear-gradient(155deg,#151515,#0c0c0c); display:flex; flex-direction:column; cursor:pointer; transition:.3s ease; position:relative; overflow:hidden; }
        .service-card-v2:before { content:''; position:absolute; width:160px; height:160px; border-radius:50%; background:rgba(183,255,60,.07); right:-70px; top:-70px; filter:blur(2px); }
        .service-card-v2:hover { transform:translateY(-7px); border-color:rgba(183,255,60,.45); box-shadow:0 24px 50px rgba(0,0,0,.3); }
        .service-card-v2 .card-icon { font-size:34px; margin-bottom:auto; }
        .service-card-v2 .card-title { margin-top:36px; }
        .service-meta { display:flex; justify-content:space-between; gap:12px; margin-top:18px; padding-top:16px; border-top:1px solid var(--border); font-size:12px; color:var(--text-secondary); }
        .service-meta b { color:var(--accent); font-size:14px; }
        .banner { width:min(1280px,calc(100% - 48px)); margin:70px auto; min-height:480px; border-radius:32px; overflow:hidden; position:relative; border:1px solid var(--border); background:#111; }
        .banner img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:saturate(.65) contrast(1.1); }

            const [searchOrderId, setSearchOrderId] = useState(orderId || '');

            useEffect(() => {

                        const data = JSON.parse(booking);

                            setOrder({
                                ...data,
                                status: 'REPAIR IN PROGRESS',
                                professional: PROFESSIONALS[0],
                                timeline: [
                                    { stage: 'Booking Confirmed', completed: true },
                                    { stage: 'Professional Assigned', completed: true },

                                    { stage: 'Quality Check', completed: false },
                                    { stage: 'Repair Completed', completed: false },

                    const phoneMatches = !searchPhone || data.phone === searchPhone;

                        setOrder({...data, device: DEVICES[data.brand]?.find(d=>d.id===data.device)?.name || data.device, repair: REPAIRS.find(r=>r.id===data.repair)?.name || data.repair, status:'BOOKED', professional: PROFESSIONALS[0], timeline:[{stage:'Booking Confirmed',completed:true},{stage:'Professional Assignment',completed:false,active:true},{stage:'En Route',completed:false},{stage:'Device Inspection',completed:false},{stage:'Repair In Progress',completed:false},{stage:'Quality Check',completed:false},{stage:'Repair Completed',completed:false},{stage:'Warranty Activated',completed:false}]});
                        return;
                    }
                }
                if (searchOrderId === 'HKM-240518') {
                    const demoOrder = {
                        orderId: 'HKM-240518',
                        device: 'iPhone 15 Pro',
                        repair: 'Screen Repair',
                        amount: 3999,
                        professional: PROFESSIONALS[1],
                        status: 'REPAIR IN PROGRESS',
                        timeline: [
                            { stage: 'Booking Confirmed', completed: true },
                            { stage: 'Professional Assigned', completed: true },
                            { stage: 'En Route', completed: true },
                            { stage: 'Arrived at Location', completed: true },
                            { stage: 'Device Inspection', completed: true },
                            { stage: 'Repair Approved', completed: true },
                            { stage: 'Payment Verified', completed: true },
                            { stage: 'Repair In Progress', completed: false, active: true },
                            { stage: 'Quality Check', completed: false },
                            { stage: 'Repair Completed', completed: false },
                            { stage: 'Warranty Activated', completed: false },
                        ]
                    };
                    setOrder(demoOrder);
                }

            return (
                <div>
                    <section className="hero" style={{ minHeight: '40vh' }}>
                        <h1>Track your <span>repair journey</span></h1>
                        <p className="hero-subtitle">Live updates at every step</p>
                    </section>

                    <section className="section">
                        {!order ? (
                            <div style={{ maxWidth: '600px', margin: '0 auto' }}>
                                <h2>Track Your Repair</h2>
                                <div className="form-group">
                                    <label className="form-label">Order ID</label>
                                    <input 
                                        type="text" 
                                        className="form-input"
                                        placeholder="e.g., HKM-240518"
                                        value={searchOrderId}
                                        onChange={(e) => setSearchOrderId(e.target.value)}
                                    />
                                </div>
                                <div className="form-group">
                                    <label className="form-label">Phone Number</label>
                                    <input 
                                        type="tel" 
                                        className="form-input"
                                        placeholder="+91 XXXXXXXXXX"
                                        value={searchPhone}
                                        onChange={(e) => setSearchPhone(e.target.value)}
                                    />
                                </div>
                                <button 
                                    className="btn btn-primary" 
                                    style={{ width: '100%', padding: '16px', fontSize: '16px' }}
                                    onClick={handleSearch}
                                >
                                    Track My Repair
                                </button>
                                <div style={{ marginTop: '40px', padding: '24px', background: 'var(--bg-card)', borderRadius: '12px', border: '1px solid var(--border)' }}>

                                            <div style={{ fontSize: '13px', color: 'var(--accent)', marginTop: '8px' }}>⭐ {order.professional.rating} • {order.professional.specialization}</div>

                                            <div style={{ color: 'var(--text-secondary)', fontSize: '14px', marginBottom: '4px' }}>Service Amount</div>
                                            <div style={{ fontSize: '18px', fontWeight: '600', color: 'var(--accent)' }}>₹{order.amount}</div>

                                {/* Timeline */}
                                <h2 style={{ marginBottom: '40px', marginTop: '60px' }}>Repair Progress</h2>
                                <div className="timeline">
                                    {order.timeline.map((item, idx) => (
                                        <div 
                                            key={idx}
                                            className={`timeline-item ${item.completed ? 'completed' : ''} ${item.active ? 'active' : ''}`}

                                            <div className="timeline-node"></div>
                                            <div className="timeline-content">

                                                {item.completed && <div className="timeline-desc">✓ Completed</div>}

                                            </div>
                                        </div>
                                    ))}

                                {/* Warranty Section */}
                                <div style={{ marginTop: '60px', padding: '32px', background: 'linear-gradient(135deg, var(--bg-card) 0%, var(--bg-surface) 100%)', borderRadius: '12px', border: '1px solid var(--border)' }}>
                                    <h3 style={{ fontSize: '20px', fontWeight: '600', marginBottom: '24px' }}>🛡️ Your Warranty Protection</h3>
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '32px', fontSize: '14px' }}>
                                        <div>
                                            <div style={{ color: 'var(--accent)', fontWeight: '600', marginBottom: '8px' }}>Coverage Type</div>

                                            <div style={{ color: 'var(--accent)', fontWeight: '600', marginBottom: '8px' }}>Support</div>
                                            <div style={{ color: 'var(--text-secondary)' }}>24/7 Customer Support</div>

                                    style={{ marginTop: '40px', padding: '12px 24px' }}

                                    Track Another Repair
                                </button>
                            </div>
                        )}
                    </section>
                </div>
            );
        }

        // Router
        function useNavigate() {
            return (path) => {
                window.history.pushState(null, '', path);
                window.setCurrentPage(path);
            };
        }

        // App
        function App() {
            const [currentPage, setCurrentPage] = useState(window.location.pathname);

            window.setCurrentPage = setCurrentPage;

            useEffect(() => {
                const handlePopState = () => {
                    setCurrentPage(window.location.pathname);
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            const renderPage = () => {
                if (currentPage.includes('/repair') && !currentPage.includes('/device-repair') && !currentPage.includes('/book-repair')) {
                    return <RepairPage />;
                } else if (currentPage.includes('/device-repair')) {
                    return <DeviceRepairPage />;
                } else if (currentPage.includes('/book-repair')) {
                    return <BookRepairPage />;
                } else if (currentPage.includes('/track')) {
                    return <TrackRepairPage />;
                } else {
                    return <HomePage />;
                }
            };

            return (
                <div>
                    <Navigation />
                    {renderPage()}
                    <footer className="footer" id="support">
                        <div className="footer-content">
                            <div className="footer-column">
                                <h3>HUKMEE</h3>
                                <a href="#about">About Us</a>
                                <a href="#careers">Careers</a>
                                <a href="#blog">Blog</a>
                                <a href="#press">Press</a>
                            </div>
                            <div className="footer-column">
                                <h3>Services</h3>
                                <a href="#repair">Mobile Repair</a>
                                <a href="#devices">Device Support</a>
                                <a href="#warranty">Warranty Info</a>
                                <a href="#pricing">Pricing</a>
                            </div>
                            <div className="footer-column">
                                <h3>Support</h3>
                                <a href="#faq">FAQ</a>
                                <a href="#contact">Contact Us</a>
                                <a href="/track" onClick={(e) => { e.preventDefault(); window.history.pushState(null, '', '/track'); window.setCurrentPage('/track'); }}>Track Order</a>
                                <a href="#help">Help Center</a>
                            </div>
                            <div className="footer-column">
                                <h3>Company</h3>
                                <a href="#mission">Our Mission</a>
                                <a href="#community">Community</a>
                                <a href="#partners">Partners</a>
                                <a href="#investors">Investors</a>
                            </div>
                            <div className="footer-column">
                                <h3>Legal</h3>
                                <a href="#privacy">Privacy Policy</a>
                                <a href="#terms">Terms of Service</a>
                                <a href="#cookies">Cookie Policy</a>
                                <a href="#security">Security</a>
                            </div>
                        </div>
                        <div className="footer-bottom">
                            <p>© {new Date().getFullYear()} HUKMEE. Bringing professional mobile device repair to your doorstep. All rights reserved.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
